const buscarCEP = (cep, onSuccess, onError) => {
  const nums = cep.replace(/[^0-9]/g, "");
  if (nums.length !== 8) {
    onError && onError("CEP deve ter 8 digitos");
    return;
  }
  const cbName = "viacep_cb_" + Date.now();
  window[cbName] = data => {
    delete window[cbName];
    const s = document.getElementById("viacep_script_" + cbName);
    if (s) s.remove();
    if (data.erro) {
      onError && onError("CEP nao encontrado");
      return;
    }
    onSuccess({
      rua: data.logradouro || "",
      bairro: data.bairro || "",
      cidade: data.localidade || "",
      estado: data.uf || ""
    });
  };
  const script = document.createElement("script");
  script.id = "viacep_script_" + cbName;
  script.src = "https://viacep.com.br/ws/" + nums + "/json/?callback=" + cbName;
  script.onerror = () => {
    delete window[cbName];
    script.remove();
    onError && onError("Erro de conexao com ViaCEP");
  };
  document.head.appendChild(script);
};
const compressFile = (file, onDone) => {
  const MAX_IMG_SIZE = 1200;
  const IMG_QUALITY = 0.75;
  const MAX_MB = 5;
  // Threshold: files bigger than 80KB go to separate table
  const INLINE_LIMIT = 30 * 1024;
  const handleResult = (dataURL, filename) => {
    // If small, keep inline as base64
    if (dataURL.length < INLINE_LIMIT) {
      onDone(dataURL, filename);
      return;
    }
    // Large: upload to app_files table, return marker
    const fileId = 'f_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    const contentType = file.type || 'application/octet-stream';
    uploadFile(fileId, filename, dataURL, contentType, file.size).then(ok => {
      if (ok) {
        // Return marker instead of base64 - dataURL stays as fallback for immediate use
        onDone('sbfile:' + fileId, filename);
      } else {
        alert('Erro ao enviar arquivo para o servidor. Tente novamente.');
      }
    });
  };
  if (file.type === 'application/pdf') {
    if (file.size > MAX_MB * 1024 * 1024) {
      alert('Arquivo PDF muito grande (max ' + MAX_MB + 'MB). Reduza o tamanho antes de anexar.');
      return;
    }
    const r = new FileReader();
    r.onload = ev => handleResult(ev.target.result, file.name);
    r.readAsDataURL(file);
    return;
  }
  if (!file.type.startsWith('image/')) {
    if (file.size > MAX_MB * 1024 * 1024) {
      alert('Arquivo muito grande (max ' + MAX_MB + 'MB).');
      return;
    }
    const r = new FileReader();
    r.onload = ev => handleResult(ev.target.result, file.name);
    r.readAsDataURL(file);
    return;
  }
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    URL.revokeObjectURL(url);
    let w = img.width,
      h = img.height;
    if (w > MAX_IMG_SIZE || h > MAX_IMG_SIZE) {
      const s = Math.min(MAX_IMG_SIZE / w, MAX_IMG_SIZE / h);
      w = Math.round(w * s);
      h = Math.round(h * s);
    }
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const compressed = canvas.toDataURL('image/jpeg', IMG_QUALITY);
    const sizeMB = Math.round(compressed.length * 0.75 / 1024 / 1024 * 10) / 10;
    if (sizeMB > MAX_MB) {
      alert('Imagem ainda muito grande (' + sizeMB + 'MB) após compressão.');
      return;
    }
    handleResult(compressed, file.name.replace(/\.[^.]+$/, '.jpg'));
  };
  img.onerror = () => {
    const r = new FileReader();
    r.onload = ev => handleResult(ev.target.result, file.name);
    r.readAsDataURL(file);
  };
  img.src = url;
};

const resolveFileURL = async dataOrMarker => {
  if (!dataOrMarker) return null;
  if (typeof dataOrMarker === 'string' && dataOrMarker.startsWith('sbfile:')) {
    const fileId = dataOrMarker.slice(7);
    const f = await downloadFile(fileId);
    return f?.content || null;
  }
  return dataOrMarker;
};
const cpfM = v => {
  const d = v.replace(/\D/g, "").slice(0, 11);
  if (d.length <= 3) return d;
  if (d.length <= 6) return d.slice(0, 3) + "." + d.slice(3);
  if (d.length <= 9) return d.slice(0, 3) + "." + d.slice(3, 6) + "." + d.slice(6);
  return d.slice(0, 3) + "." + d.slice(3, 6) + "." + d.slice(6, 9) + "-" + d.slice(9);
};
const cnpjM = v => {
  const d = v.replace(/\D/g, "").slice(0, 14);
  if (d.length <= 2) return d;
  if (d.length <= 5) return d.slice(0, 2) + "." + d.slice(2);
  if (d.length <= 8) return d.slice(0, 2) + "." + d.slice(2, 5) + "." + d.slice(5);
  if (d.length <= 12) return d.slice(0, 2) + "." + d.slice(2, 5) + "." + d.slice(5, 8) + "/" + d.slice(8);
  return d.slice(0, 2) + "." + d.slice(2, 5) + "." + d.slice(5, 8) + "/" + d.slice(8, 12) + "-" + d.slice(12);
};
const vCPF = c => {
  const d = c.replace(/\D/g, "");
  if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
  let s = 0;
  for (let i = 0; i < 9; i++) s += +d[i] * (10 - i);
  let r = s * 10 % 11;
  if (r === 10 || r === 11) r = 0;
  if (r !== +d[9]) return false;
  s = 0;
  for (let i = 0; i < 10; i++) s += +d[i] * (11 - i);
  r = s * 10 % 11;
  if (r === 10 || r === 11) r = 0;
  return r === +d[10];
};
